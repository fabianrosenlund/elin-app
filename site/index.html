<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C231E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ELIN">
<meta name="description" content="ELIN, ett steg i taget. Ett stöd för att logga mat och mående. Inte vård.">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>ELIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&family=Noto+Sans:wght@400;500;700&display=swap">
<style>
/* Brand: ELIN brandbook (01 Grodden). Noto Sans 400/700, palette Skogsgrön #25372B, Krämvit #F2F3EB, Ljus salvia #DCE5D0, Groddgrön #86A97A (accent only, never body text).
   Layout: a diary on paper. One column; Idag is a day page with a dotted timeline where entries land at their time. Brand from the logo: forest ink, two leaf greens, paper. User's own words in the logo's rounded type. */
:root{
  --bg:#F2F3EB; --surface:#FAFBF5; --sunk:#E6EADC; --ink:#25372B; --muted:#66705F;
  --line:#D6DBC8; --accent:#4A7052; --accent-ink:#F7F8F1; --soft:#DCE5D0; --leaf:#86A97A;
  --lilac:#5F7F95; --lilac-soft:#E2E9EC; --warm:#A9563C; --warm-soft:#F4E2D8; --sun:#D49B3A; --water:#5E8FAE; --water-soft:#E1EBF0;
  --display:"Noto Sans", system-ui, -apple-system, sans-serif;
  --body:"Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --hand:"Noto Sans", system-ui, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C231E; --surface:#242D26; --sunk:#2D382F; --ink:#E6EBDD; --muted:#A3AE9B;
  --line:#3A473C; --accent:#9CBF88; --accent-ink:#1C231E; --soft:#2F3D31; --leaf:#6E8F5E;
  --lilac:#9DB9CC; --lilac-soft:#27343B; --warm:#E59A7E; --warm-soft:#3B2A23; --sun:#E3B25A; --water:#8DB8D4; --water-soft:#22323B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C231E; --surface:#242D26; --sunk:#2D382F; --ink:#E6EBDD; --muted:#A3AE9B;
  --line:#3A473C; --accent:#9CBF88; --accent-ink:#1C231E; --soft:#2F3D31; --leaf:#6E8F5E;
  --lilac:#9DB9CC; --lilac-soft:#27343B; --warm:#E59A7E; --warm-soft:#3B2A23; --sun:#E3B25A; --water:#8DB8D4; --water-soft:#22323B; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;height:100%;overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;width:100%;margin:0}
#scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
body.ob #scroller{padding-bottom:24px}
button,nav,header.top,.seg,.faces,.meals{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app.enter{animation:viewin .18s ease-out}@keyframes viewin{from{opacity:.4;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){#app.enter{animation:none}}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  }
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:1.55rem;line-height:1.15} h3{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.hw{font-family:var(--hand);font-weight:700;letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:max(20px,calc(env(safe-area-inset-top,0px) + 10px))}
.logo{font-family:'Nunito',var(--display);font-weight:900;font-size:2.5rem;letter-spacing:-.01em;line-height:1;color:var(--ink);display:inline-flex;align-items:baseline;white-space:nowrap;padding-top:.22em}
.logo .li{position:relative;display:inline-block}
.logo .li svg{position:absolute;left:50%;top:-.07em;width:.48em;height:.36em;transform:translateX(-50%);overflow:visible}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{color:var(--muted);font-size:.78rem;letter-spacing:.04em}
.help-btn{background:var(--warm-soft);color:var(--warm);border:0;padding:9px 14px;border-radius:999px;font-weight:700;font-size:.9rem;white-space:nowrap}
.notice{border-left:3px solid var(--leaf);padding:4px 0 4px 14px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.notice p{min-width:0}
.link-btn{background:none;border:0;color:var(--accent);font-weight:700;padding:0;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;text-align:left}
.example-bar{border:1.5px dashed var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;font-size:.88rem;color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{background:none;border:0;border-radius:14px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;color:var(--muted);min-width:0;font-weight:700}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}
nav.tabs button[aria-current="page"] span{position:relative}
nav.tabs button[aria-current="page"] span::after{content:"";position:absolute;left:15%;right:15%;bottom:-4px;height:3px;border-radius:3px;background:var(--leaf)}

/* day page */
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.dayhead .eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dayhead .date{font-family:var(--hand);font-weight:700;font-size:1.85rem;line-height:1.05;letter-spacing:-.02em}
.daynav{display:flex;gap:6px}
.daynav button{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;font-size:1.15rem;line-height:1}
.daynav button:disabled{opacity:.3;cursor:default}
.quote{font-family:var(--hand);font-size:1.1rem;line-height:1.3;color:var(--accent);font-weight:700}
.daycard{background:var(--surface);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.leafrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.leafrow svg{width:26px;height:26px}
.leafrow .lbl{margin-left:8px;font-weight:700;font-size:.92rem}
.energy{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:12px}
.ebar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.ebar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--leaf),var(--accent))}
.drinks{display:flex;align-items:center;gap:10px;justify-content:space-between;border-top:1px dashed var(--line);padding-top:12px}
.glasses{display:flex;flex-wrap:wrap;gap:1px;min-width:0;margin-top:2px}
.glasses svg{width:18px;height:22px}
.step{display:flex;gap:6px;flex:none}
.step button{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:1.2rem;line-height:1;font-weight:700}
.step button.add{background:var(--water-soft);border-color:transparent;color:var(--water)}
.compose{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--ink);color:var(--bg);border:0;border-radius:var(--r);padding:16px 18px}
.compose svg{width:26px;height:26px;flex:none;color:var(--leaf)}
.compose .hw{font-size:1.2rem;font-weight:700;line-height:1.2}
.compose small{display:block;font-family:var(--body);font-size:.8rem;opacity:.75;margin-top:2px}

.tl{position:relative;display:flex;flex-direction:column;gap:16px;padding-left:36px}
.tl::before{content:"";position:absolute;left:12px;top:8px;bottom:8px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 5px,transparent 5px 10px)}
.tl-item{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0}
.tl-dot{position:absolute;left:-36px;top:-1px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:50%}
.tl-dot svg{width:22px;height:22px}
.tl-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tl-head b{font-weight:700}
.tl-head time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.tl-item.later .tl-head b{color:var(--muted);font-weight:700}
.tl-cta{align-self:flex-start;background:none;border:1.5px dashed var(--line);border-radius:999px;padding:6px 14px;color:var(--accent);font-weight:700;font-size:.85rem}
.tl-now{position:relative;display:flex;align-items:center;gap:8px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sun);font-weight:700}
.tl-now::before{content:"";position:absolute;left:-29px;width:12px;height:12px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 25%,transparent)}
.tl-now::after{content:"";flex:1;height:1.5px;background:color-mix(in srgb,var(--sun) 50%,transparent)}
.note-card{background:var(--surface);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;text-align:left;border:0;width:100%}
.note-card .hw{display:block;font-size:1.08rem;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.note-card img{width:56px;height:56px;object-fit:cover;border-radius:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.note{display:block;margin-top:8px;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.chip{font-size:.74rem;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:500}
.chip.m{background:var(--soft);color:var(--accent);font-weight:700}
.chip.star{background:var(--lilac-soft);color:var(--lilac)}
.chip.b{background:var(--warm-soft);color:var(--warm)}
.chip.g{background:color-mix(in srgb,var(--sun) 20%,var(--surface));color:var(--ink)}
.chip.ex{border:1px dashed var(--muted);background:none}
.empty{padding:24px 18px;text-align:center;color:var(--muted)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .ghost{flex:1}

.primary{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:14px 20px;font-weight:700;font-size:1rem;width:100%}
.primary:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:700}
.card{background:var(--surface);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lead{color:var(--muted);max-width:60ch}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:0;align-self:flex-start}

/* Mer menu */
.menu{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.menu a{color:inherit;text-decoration:none}
.menu button,.menu a{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 16px}
.menu button:first-child,.menu a:first-child{border-top:0}
.menu .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.menu .ic.w{background:var(--warm-soft);color:var(--warm)}
.menu .ic svg{width:22px;height:22px}
.menu b{display:block}
.menu small{color:var(--muted)}
.menu .chev{color:var(--muted);font-size:1.3rem}

.scrim{position:fixed;inset:0;background:color-mix(in srgb,#141a15 50%,transparent);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#splash{position:fixed;inset:0;z-index:50;background:#25372B;display:none;align-items:center;justify-content:center;transition:opacity .35s ease}
.standalone #splash{display:flex}
#splash .appicon{width:96px;height:96px;background:transparent;box-shadow:none}
#splash.out{opacity:0;pointer-events:none}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:5px;background:var(--line);margin:-8px auto -6px;flex:none}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:24px 24px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px;max-height:88vh}}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{background:var(--sunk);border:0;border-radius:999px;width:36px;height:36px;font-size:1.2rem;line-height:1;flex:none}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lbl{font-weight:700;font-size:.92rem}
.hint{font-size:.84rem;color:var(--muted)}
input,textarea,select{font-size:16px}
input[type=text],input[type=time],input[type=number],input[type=date],textarea,select{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input#f-what,textarea#f-note,input#f-goodtext{font-family:var(--hand);font-size:1.05rem;font-weight:700;padding:10px 12px;line-height:1.3}
textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.two>*{min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;min-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.toggle{background:var(--surface);border:1.5px solid transparent;border-radius:999px;padding:8px 14px;font-size:.92rem}
.seg button[aria-pressed="true"],.toggle[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.seg.b button[aria-pressed="true"]{background:var(--warm-soft);border-color:var(--warm)}
.seg.gd button[aria-pressed="true"]{background:color-mix(in srgb,var(--sun) 22%,var(--surface));border-color:var(--sun)}
.toggle.star[aria-pressed="true"]{background:var(--lilac-soft);border-color:var(--lilac)}
.seg.quick button{background:transparent;border:1.5px dashed var(--line);font-size:.85rem}
details.more{border-top:1px dashed var(--line);padding-top:12px}
details.more summary{cursor:pointer;font-weight:700}
details.more[open] summary{margin-bottom:10px}

.steps{display:flex;gap:6px;align-items:center;flex:1}
.steps i{height:5px;border-radius:99px;background:var(--line);flex:1;transition:background .25s}
.steps i.on{background:var(--accent)}
.bigq{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.meals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meals button{background:var(--surface);border:1.5px solid transparent;border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.9rem}
.meals button svg{width:28px;height:28px;color:var(--accent)}
.meals button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);font-weight:700}
.photo{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px 12px;position:relative}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:12px;flex:none}
.photo .ph-ic{width:64px;height:64px;border-radius:12px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.photo label.ghost{cursor:pointer;display:inline-block}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.faces button{background:var(--surface);border:1.5px solid transparent;border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted)}
.faces button svg{width:34px;height:34px}
.faces button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--ink);font-weight:700}
.react{font-family:var(--hand);font-size:1.1rem;line-height:1.3;color:var(--accent);font-weight:700}
.react.l{color:var(--lilac)}
.wz-nav{display:flex;gap:10px;align-items:center}
.wz-nav .primary{flex:1}
.wz-nav .ghost{flex:none}
.req{font-weight:700;color:var(--muted);font-size:.85em}
.skip{display:block;text-align:center;margin-top:-6px;align-self:center}

.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-block:8px}
.done svg.sprout{width:150px;height:150px}
.done h2{font-size:1.7rem}
.done .muted{max-width:34ch}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--soft);color:var(--accent);font-weight:700;border-radius:999px;padding:6px 12px;font-size:.88rem}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .24s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}
  .sprout .stem{transform-origin:75px 120px;animation:grow .7s cubic-bezier(.3,1.4,.5,1) both}
  .sprout .lf{transform-box:fill-box;transform-origin:bottom center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
  .sprout .lf.a{animation-delay:.35s}.sprout .lf.b{animation-delay:.5s}
  .sprout .spark{animation:spark 1.2s ease-out .6s both}
  .rung.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
  @keyframes grow{from{transform:scaleY(0)}}
  @keyframes pop{from{transform:scale(.5)}}
  @keyframes spark{0%{opacity:0;transform:translateY(6px)}40%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);
  padding:12px 16px;border-radius:14px;max-width:min(92vw,460px);font-size:.95rem;box-shadow:0 8px 28px rgba(0,0,0,.18)}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.quad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.quad{grid-template-columns:1fr}}
.qbox{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.qbox.change{background:var(--soft)}
.qbox h3{font-size:.92rem}
.qbox ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;font-family:var(--hand);font-size:1rem;font-weight:700;line-height:1.35}
.qbox li{overflow-wrap:anywhere}
.qbox li button{background:none;border:0;color:var(--muted);padding:0 4px;font-size:.85rem;font-family:var(--body)}
.addline{display:flex;gap:6px}
.addline input{flex:1;min-width:0;background:var(--bg)}
.addline button{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:0 12px;font-weight:700}

.ladder{position:relative;display:flex;flex-direction:column-reverse;gap:10px;padding-inline:14px}

function expectedWeight(d){const g=S.goals;if(!g.start||!g.startDate)return null;const w=g.start+g.pace*daysBetween(g.startDate,d)/7;return g.target?Math.min(w,g.target):w}

function lastDays(n){const out=[];for(let i=n-1;i>=0;i--)out.push(addDays(today(),-i));return out}
function vKurvor(){
  const days=lastDays(14);
  const data=days.map(d=>{const l=entriesOn(d).filter(e=>e.kind!=='dryck');const f=l.filter(e=>e.before!=null);const a=l.filter(e=>e.after!=null);
    return {d,n:planStatus(d).done,dr:drinksOn(d),good:l.filter(e=>e.good.length||e.goodText).length,before:f.length?f.reduce((s,e)=>s+e.before,0)/f.length:null,after:a.length?a.reduce((s,e)=>s+e.after,0)/a.length:null}});
  const plan=S.plan.length;
  const W=320,H=150,L=26,R=8,T=12,B=26,cw=(W-L-R)/days.length;
  const xl=(i,d)=>{if(i%2===days.length%2||i===days.length-1){const dd=new Date(d+'T12:00:00');return `<text x="${L+i*cw+cw/2}" y="${H-8}" text-anchor="middle">${dd.getDate()}/${dd.getMonth()+1}</text>`}return ''};
  const y=v=>T+(H-T-B)*(1-v/Math.max(plan,1));
  let bars=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Antal tillfällen i planen som loggats per dag de senaste 14 dagarna">`;
  for(let g=0;g<=plan;g+=Math.max(1,Math.ceil(plan/3))){bars+=`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${L-6}" y="${y(g)+3}" text-anchor="end">${g}</text>`}
  bars+=`<line x1="${L}" x2="${W-R}" y1="${y(plan)}" y2="${y(plan)}" stroke="var(--lilac)" stroke-dasharray="4 3"/>`;
  data.forEach((v,i)=>{const x=L+i*cw+cw*.18,w=cw*.64,yy=y(v.n);
    bars+=`<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(0,y(0)-yy)}" rx="3" fill="${v.n>=plan-1?'var(--accent)':'color-mix(in srgb,var(--accent) 45%,var(--surface))'}"/>`+xl(i,v.d)});
  bars+='</svg>';
  const y2=v=>T+(H-T-B)*(1-(v-1)/4);
  let feel=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Genomsnittlig oro före och efter ätande per dag">`;
  [1,3,5].forEach(g=>{feel+=`<line x1="${L}" x2="${W-R}" y1="${y2(g)}" y2="${y2(g)}" stroke="var(--line)"/><text x="${L-6}" y="${y2(g)+3}" text-anchor="end">${g}</text>`});
  const line=(key,col)=>{let p='',dots='';data.forEach((v,i)=>{if(v[key]==null)return;const x=L+i*cw+cw/2,yy=y2(v[key]);p+=(p?'L':'M')+x.toFixed(1)+' '+yy.toFixed(1);dots+=`<circle cx="${x}" cy="${yy}" r="${i===data.length-1?4:2.5}" fill="${col}"/>`});return `<path d="${p}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`+dots};
  feel+=line('before','var(--lilac)')+line('after','var(--accent)');
  data.forEach((v,i)=>{feel+=xl(i,v.d)});feel+='</svg>';
  const mx=Math.max(8,...data.map(v=>v.dr)),y3=v=>T+(H-T-B)*(1-v/mx);
  let dr=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Glas dryck per dag">`;
  [0,4,8].forEach(g=>{dr+=`<line x1="${L}" x2="${W-R}" y1="${y3(g)}" y2="${y3(g)}" stroke="var(--line)"/><text x="${L-6}" y="${y3(g)+3}" text-anchor="end">${g}</text>`});
  data.forEach((v,i)=>{const x=L+i*cw+cw*.18,w=cw*.64,yy=y3(v.dr);dr+=`<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(0,y3(0)-yy)}" rx="3" fill="var(--water)" opacity="${v.dr>=6?1:.55}"/>`+xl(i,v.d)});dr+='</svg>';
  const week=data.slice(-7), regular=week.filter(v=>v.n>=plan-1).length, logged=week.filter(v=>v.n>0).length, goodW=week.reduce((s,v)=>s+v.good,0);
  let h=`<h2>Kurvor</h2><p class="muted">Här ser du mönster över tid: hur regelbundet du äter, hur det känns och vad som var gott. Inga kalorier, inga portioner.</p>
  <div class="card"><div class="section-h"><h3>Regelbundenhet</h3><span class="small muted">senaste 14 dagarna</span></div>
    <div class="chart">${bars}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Tillfällen i planen som loggats</span><span><i style="background:var(--lilac)"></i>Din plan (${plan} st)</span></div>
    <p class="small">Den här veckan har du loggat ${logged} av 7 dagar, och ${regular} dagar låg nära din plan.${goodW?` Du har hittat något gott ${goodW} gånger.`:''}</p></div>
  <div class="card"><div class="section-h"><h3>Oro kring maten</h3><span class="small muted">1 = lugn, 5 = panik</span></div>
    <div class="chart">${feel}</div>
    <div class="legend"><span><i style="background:var(--lilac)"></i>Före</span><span><i style="background:var(--accent)"></i>Efter</span></div>
    <p class="small muted">Oro brukar gå upp och ner. Att den finns betyder inte att det går dåligt, och den brukar minska när ätandet blir regelbundet.</p></div>
  <div class="card"><div class="section-h"><h3>Dryck</h3><span class="small muted">glas per dag</span></div><div class="chart">${dr}</div></div>`;
  h+=vJourney();
  return h;
}
function vJourney(){
  const g=S.goals;
  if(!S.settings.weightOn) return `<div class="card"><h3>Din resa</h3><p class="small muted">Vikten visas inte här som standard. Om du och din behandlare vill kan du slå på veckovägning under <button class="link-btn" data-act="settings">Inställningar och mål</button>. Du ser då bara hur du rör dig mot målet, inga siffror.</p></div>`;
  const w=S.weights.slice().sort((a,b)=>a.d.localeCompare(b.d));
  let h=`<div class="card journey"><div class="section-h"><h3>Din resa</h3><button class="ghost small" data-act="addWeight">Veckans vägning</button></div>`;
  if(!g.start||!g.target||!w.length){h+=`<p class="small muted">${!g.start||!g.target?'Start och mål läggs in under Inställningar och mål, gärna tillsammans med din behandlare.':'Lägg in veckans vägning så visas din resa här.'}</p></div>`;return h}
  const cur=w[w.length-1].kg, f=Math.max(0,Math.min(1,(cur-g.start)/(g.target-g.start)));
  const pts=[[20,70],[90,40],[160,62],[230,30],[300,46]];
  const path='M20 70 C55 30 60 40 90 40 S130 70 160 62 S200 25 230 30 S280 50 300 46';
  const px=20+f*280;
  h+=`<svg viewBox="0 0 320 100" role="img" aria-label="Du har kommit en bit på vägen mot ditt mål"><path d="${path}" fill="none" stroke="var(--line)" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 10"/>
    <circle cx="300" cy="46" r="10" fill="var(--soft)" stroke="var(--accent)" stroke-width="2"/><path d="M296 46l3 3 5-6" stroke="var(--accent)" stroke-width="2" fill="none"/>
    <circle cx="${px}" cy="${pts.reduce((a,p)=>Math.abs(p[0]-px)<Math.abs(a[0]-px)?p:a)[1]}" r="9" fill="var(--sun)" stroke="var(--surface)" stroke-width="3"/></svg>
    <p class="small">${f>=1?'Du har nått det mål ni satt upp. Prata med din behandlare om vad som händer nu.':f>.5?'Du har kommit en bra bit på vägen. Kroppen tackar dig.':'Du är på väg. Varje vecka med regelbundna måltider tar dig framåt.'}</p>
    <p class="small muted">Vikten i sig visas inte här. Siffrorna finns i PDF:en till din behandlare.</p></div>`;
  return h;
}

/* ---------- progress: ladder + garden ---------- */
function points(){
  const E=S.entries;
  let p=E.length + E.filter(e=>e.note).length + E.filter(e=>e.before!=null).length*0.5 + E.filter(e=>e.good.length||e.goodText).length;
  p+=Object.values(S.reasons).flat().length*2 + S.tipsRead.length + S.ladder.reduce((s,l)=>s+l.tries*3+(l.done?5:0),0);
  return Math.floor(p);
}
function badges(){
  const E=S.entries,days=new Set(E.map(e=>e.date));
  const fullDays=[...days].filter(d=>planStatus(d).done>=S.plan.length-1).length;
  const back=[...days].sort().some((d,i,a)=>i>0&&daysBetween(a[i-1],d)>=2);
  return [
   ['Första steget','Du loggade din första måltid.',E.length>=1],
   ['Ärlig mot dig själv','Du loggade en stund som kändes svår eller oplanerad.',E.some(e=>e.unplanned||(e.beh||[]).length)],
   ['Ord för känslan','Du skrev om tankar eller känslor 5 gånger.',E.filter(e=>e.note).length>=5],
   ['Matglädje','Du hittade något gott med maten 5 gånger.',E.filter(e=>e.good.length||e.goodText).length>=5],
   ['Modig','Du åt trots att oron var hög.',E.some(e=>e.before>=4)],
   ['Ett steg på stegen','Du testade en mat från din utmaningsstege.',S.ladder.some(l=>l.tries>0)],
   ['Regelbunden dag','En dag där du loggade nästan alla tillfällen i planen.',fullDays>=1],
   ['Tre regelbundna dagar','Tre dagar nära planen. De behöver inte vara i rad.',fullDays>=3],
   ['Minnessamlare','Du sparade tre måltidsminnen med foto.',E.filter(e=>e.photo).length>=3],
   ['Båda sidor','Du skrev skäl i alla fyra rutorna.',Object.values(S.reasons).every(a=>a.length)],
   ['Välkommen tillbaka','Du kom tillbaka efter ett uppehåll. Det är alltid värt det.',back]
  ];
}
function plantSvg(p){
  const stage=Math.min(5,Math.floor(p/12)), leaves=Math.min(26,p), h=30+stage*20;
  let svg=`<svg viewBox="0 0 200 180" role="img" aria-label="Din växt, steg ${stage+1} av 6"><ellipse cx="100" cy="166" rx="70" ry="8" fill="var(--sunk)"/><path d="M70 140h60l-6 26H76z" fill="var(--warm)" opacity=".75"/>`;
  svg+=`<path d="M100 140 C100 ${140-h/2} 96 ${140-h} 100 ${140-h-10}" stroke="var(--accent)" stroke-width="3" fill="none"/>`;
  for(let i=0;i<leaves;i++){const t=(i+1)/(leaves+1),yy=140-(h+10)*t,side=i%2?1:-1,len=10+((i*7)%9);
    svg+=`<path d="M100 ${yy} q ${side*len} -${len*.7} ${side*len*1.6} -2 q -${side*len*.6} ${len*.5} -${side*len*1.6} 2z" fill="${i%3===1?'var(--leaf)':'var(--accent)'}" opacity="${.55+.45*((i%3)/2)}"/>`}
  if(stage>=4) svg+=`<circle cx="100" cy="${140-h-14}" r="9" fill="var(--sun)"/><circle cx="100" cy="${140-h-14}" r="3.5" fill="var(--surface)"/>`;
  return {svg:svg+'</svg>',stage};
}

let breathT=null;
function startBreath(){clearInterval(breathT);const pr=$('#b-prog');if(!pr)return;const C=2*Math.PI*46,TOT=120;let t=0,paused=false;
  const tick=()=>{if(!$('#b-prog')){clearInterval(breathT);return}if(paused)return;t=Math.min(TOT,t+.25);const ph=t%10;
    $('#b-word').textContent=t>=TOT?'Bra gjort':ph<4?'Andas in':'Andas ut';
    const left=Math.ceil(TOT-t);$('#b-time').textContent=`0${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
    pr.style.strokeDashoffset=C*(1-t/TOT);document.querySelector('.ring').dataset.ph=ph<4?'in':'ut';if(t>=TOT){clearInterval(breathT);$('#b-pause').textContent='Börja om';paused='done'}};
  $('#b-pause').onclick=()=>{if(paused==='done'){startBreath();return}paused=!paused;$('#b-pause').textContent=paused?'Fortsätt':'Pausa';document.querySelector('.ring').classList.toggle('paused',paused)};
  tick();breathT=setInterval(tick,250)}

      const pk=b.closest('[data-pick]');if(pk){const k=pk.dataset.pick;d[k]=d[k]===b.dataset.v?'':b.dataset.v;$('#f-'+k).value=d[k];pk.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===d[k]));return}
      const sc=b.closest('[data-scale]');if(sc){const v=+b.dataset.v,k=sc.dataset.scale;d[k]=d[k]===v?null:v;draw();return}
      if(b.closest('[data-good]')){const v=b.dataset.v;d.good=d.good.includes(v)?d.good.filter(x=>x!==v):[...d.good,v];b.setAttribute('aria-pressed',d.good.includes(v));return}
      if(b.closest('[data-ladder]')){ladderPick=ladderPick===b.dataset.v?null:b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===ladderPick));return}
      if(b.closest('[data-starter]')){const ta=$('#f-note');ta.value=(ta.value?ta.value.replace(/\s*$/,'')+'\n':'')+b.dataset.v;d.note=ta.value;ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);const sb=wz.querySelector('[data-nav="save"]');if(sb)sb.disabled=!d.what.trim();return}
      if(b.closest('[data-multi]')){const v=b.dataset.v;d.beh=d.beh.includes(v)?d.beh.filter(x=>x!==v):[...d.beh,v];b.setAttribute('aria-pressed',d.beh.includes(v));return}
      if(b.id==='f-star'){d.unplanned=!d.unplanned;b.setAttribute('aria-pressed',d.unplanned);return}
      if(b.hasAttribute('data-del')){if(b.dataset.sure){S.entries=S.entries.filter(x=>x.id!==d.id);delPhoto(d.id);save();closeSheet();render();toast('Måltiden är borttagen.')}else{b.dataset.sure='1';b.textContent='Tryck igen för att ta bort'}return}
      const nav=b.dataset.nav;if(!nav)return;
      if(nav==='save'){commit();return}
      if(nav==='note'){step=N-1;draw();sheet.scrollTop=0;return}
      step=Math.max(0,Math.min(N-1,step+ +nav));draw();sheet.scrollTop=0;
    });
    function commit(){
      if(!d.what.trim())return;
      if(needNote()&&!d.note.trim()){step=N-1;draw();sheet.scrollTop=0;toast('Skriv några ord om tankar och känslor, så kommer det med i loggen.');return}
      const whatChanged=!isNew&&base.what!==d.what.trim();
      d.what=d.what.trim();d.place=d.place.trim();d.company=d.company.trim();d.note=d.note.trim();d.goodText=d.goodText.trim();d.example=false;delete d.labelTouched;
      if(photoChanged){if(photoData){d.photo=setPhoto(d.id,photoData);if(!d.photo)toast('Fotot fick inte plats i webbläsarens minne, men loggen är sparad.')}else{d.photo=false;delPhoto(d.id)}}
      if(whatChanged&&d.kcalSrc!=='foto')d.kcal=null;
      const i=S.entries.findIndex(x=>x.id===d.id);if(i>=0)S.entries[i]=d;else S.entries.push(d);
      let ladder=null;if(ladderPick){ladder=S.ladder.find(l=>l.id===ladderPick);if(ladder){ladder.tries++;ladder.example=false}}
      save();render();
      const energyDrink=/mjölk|juice|smoothie|choklad|saft|läsk|yoghurt|nypon|ersättning|shake/i.test(d.what);
      if(!d.kcal&&(d.kind!=='dryck'||energyDrink)) backgroundEstimate(d.id);
      if(!isNew){closeSheet();toast('Ändringen är sparad.');return}
      celebrate(d,points()-pointsBefore,ladder);
    }
    draw();
  });
}
async function backgroundEstimate(id){
  const e=S.entries.find(x=>x.id===id);if(!e||!AI)return;
  const r=await estimate(e.what,e.label,null);
  const cur=S.entries.find(x=>x.id===id);if(cur&&r&&r.kcal){cur.kcal=r.kcal;cur.kcalSrc='text';save();if(view==='idag'&&!$('#layer .sheet'))render()}
}

function cheer(d,ladder){
  const {done,slots}=planStatus(d.date), n=entriesOn(d.date).filter(e=>e.kind!=='dryck').length;
  if(d.beh.length) return ['Tack för att du skrev ner det','Det kräver mod att vara ärlig om de svåra stunderna. Ta gärna upp det med din behandlare, och var snäll mot dig själv resten av dagen.',false];
  if(ladder) return ['Du tog ett steg på stegen!',`Du vågade: ${ladder.food.toLowerCase()}. Det är på riktigt modigt. Varje gång blir det lite lättare.`,true];
  if(d.unplanned) return ['Bra att du loggade ändå','Det är precis de här stunderna som är mest värdefulla att förstå. Du gjorde rätt som skrev ner det.',false];
  if(d.before>=4) return ['Du åt fast det var svårt','Det är ett riktigt steg framåt. Ångesten säger inte sanningen om vad du klarar.',true];
  if(d.good.length||d.goodText) return ['Vad fint att något var gott','Det sparas bland dina måltidsminnen. Mat får vara något trevligt.',true];
  if(slots.length&&done>=slots.length) return ['Hela planen idag!','Alla tillfällen i din plan är loggade. Ta en stund och känn efter hur det är.',true];
  if(n===1&&d.kind!=='dryck') return ['Dagens första är loggad','En bra start. Nu har kroppen fått energi att jobba med.',true];
  return [pick(['Snyggt loggat','Där satt den','Bra jobbat','Ett steg till']),pick(['Varje gång du loggar lär du dig lite mer om dig själv.','Regelbundet slår perfekt. Du är på rätt väg.','Din kropp tackar för energin.','Du tar hand om dig. Det märks.']),true];
}

function pdfPreview(from,to,withEx){
  const days=[];for(let d=from;d<=to&&days.length<62;d=addDays(d,1))days.push(d);
  const has=d=>entriesOn(d).some(e=>withEx||!e.example);
  const show=[...days].reverse().find(has)||to;
  const rows=entriesOn(show).filter(e=>withEx||!e.example).slice(0,8);
  const W=[9,30,18,5,12,26];
  const cells=e=>[esc(e.time),(e.kind==='maltid'?'[ ':'')+esc(e.what),esc(e.place),e.unplanned?'*':'',(e.beh||[]).join(' '),esc(e.note)];
  const body=rows.map(e=>`<tr>${cells(e).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')+Array.from({length:Math.max(0,8-rows.length)},()=>`<tr>${W.map(()=>'<td></td>').join('')}</tr>`).join('');
  return `<div class="pdfprev" aria-hidden="true"><div class="pt">Självobservation</div>
    <div class="pd"><span>Datum och veckodag: ${esc(dayLabel(show))}</span><span>${esc(S.settings.name||'')}</span></div>
    <table><colgroup>${W.map(w=>`<col style="width:${w}%">`).join('')}</colgroup>
    <tr><th>Kl</th><th>Måltid</th><th>Plats</th><th>*</th><th>K/V/L/T/H</th><th>Kommentarer, tankar, känslor</th></tr>${body}</table>
    <div class="pf"><span>Skapad i ELIN</span><span>Sida ${days.indexOf(show)+1} av ${days.length}</span></div></div>
    <p class="pdfcap">Så ser en sida ut. Du får en sida per dag, ${days.length} ${days.length===1?'sida':'sidor'} totalt.</p>`;
}

   <div class="pdfwrap" id="p-prev"></div>

   <button class="primary" id="p-go">Ladda ner PDF</button><p class="small muted" id="p-msg" role="status"></p>`,()=>{

function buildPdf(from,to,opts){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const days=[];for(let d=from;d<=to;d=addDays(d,1)){const l=entriesOn(d).filter(e=>opts.ex||!e.example);if(l.length)days.push([d,l])}
  if(!days.length)return{days:0};
  const X=15,COLS=[['Kl',13],['Måltid',46],['Plats',28],['*',8],['K/V/L/T/H',19],['Kommentarer, tankar, känslor, sammanhang\nÄtstörda/matkontrollerande beteenden\noch strategier',66]];
  const W=COLS.reduce((s,c)=>s+c[1],0), TOP=30, HEAD=16, BOTTOM=268, LH=3.9;
  let page=0, first=true;
  const newPage=()=>{if(!first)doc.addPage();first=false};
  function footer(legend=true){doc.setFont('helvetica','normal');doc.setTextColor(20);
    if(legend){doc.setFontSize(9.5);doc.text('(H) Hetsätning/överätning (K) Kräkning (V) Vätskedrivande (L) Laxerande (T) Träning',X,BOTTOM+7)}
    doc.setFontSize(7.5);doc.setTextColor(110);
    doc.text('Skapad i ELIN, ett självhjälpsverktyg som inte är vård. Upplägg enligt självobservation i KBT-E (Fairburn, 2008).',X,BOTTOM+13);
    doc.text('Sida '+(++page),X+W,BOTTOM+13,{align:'right'});doc.setTextColor(20)}
  const g=S.goals;
  if(opts.sum){
    newPage();doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text('Sammanfattning för behandlare',X,18);
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.text(`Period: ${from} till ${to}${S.settings.name?'   Namn: '+S.settings.name:''}`,X,25);
    let y=34;const kv=(k,v)=>{doc.setFont('helvetica','bold');doc.text(k,X,y);doc.setFont('helvetica','normal');doc.text(String(v),X+48,y);y+=5.5};
    doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text('Mål',X,y);y+=6;doc.setFontSize(9.5);
    if(g.start){kv('Startvikt',g.start+' kg ('+(g.startDate||'-')+')');kv('Målvikt',g.target?g.target+' kg':'-');kv('Planerad takt',String(g.pace).replace('.',',')+' kg per vecka')}
    else{doc.setFont('helvetica','normal');doc.text('Inga mål inlagda i appen.',X,y);y+=6}
    if(g.example){doc.setTextColor(150);doc.text('Obs: målen ovan är exempeldata.',X,y);doc.setTextColor(20);y+=6}
    y+=3;doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text('Veckovägningar',X,y);y+=6;doc.setFontSize(9.5);
    const ws=S.weights.filter(w=>w.d>=addDays(from,-28)&&w.d<=to).sort((a,b)=>a.d.localeCompare(b.d));
    if(!ws.length){doc.setFont('helvetica','normal');doc.text('Inga vägningar registrerade i perioden.',X,y);y+=6}
    else{const cx=[X,X+35,X+65,X+105];['Datum','Vikt','Förväntat enligt plan','Skillnad'].forEach((t,i)=>doc.text(t,cx[i],y));y+=1.5;doc.line(X,y,X+150,y);y+=4.5;doc.setFont('helvetica','normal');
      ws.forEach(w=>{const ex=expectedWeight(w.d);[w.d,w.kg.toFixed(1)+' kg',ex?ex.toFixed(1)+' kg':'-',ex?((w.kg-ex>=0?'+':'')+(w.kg-ex).toFixed(1)+' kg'):'-'].forEach((t,i)=>doc.text(t,cx[i],y));y+=5})}
    y+=4;doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text('Måltider och dryck per dag',X,y);y+=6;doc.setFontSize(9.5);
    const cx=[X,X+38,X+78];['Datum','Ät-tillfällen','Dryck'].forEach((t,i)=>doc.text(t,cx[i],y));y+=1.5;doc.line(X,y,X+120,y);y+=4.5;doc.setFont('helvetica','normal');
    for(let d=from;d<=to&&y<BOTTOM-30;d=addDays(d,1)){const all=entriesOn(d).filter(e=>opts.ex||!e.example);const l=all.filter(e=>e.kind!=='dryck');
      [d,String(l.length),drinksOn(d)?drinksOn(d)+' glas':'-'].forEach((t,i)=>doc.text(t,cx[i],y));y+=5}
    y+=6;
    if(S.ladder.length&&y<BOTTOM-20){doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text('Utmaningsstege',X,y);y+=6;doc.setFontSize(9.5);doc.setFont('helvetica','normal');
      S.ladder.slice().sort((a,b)=>a.fear-b.fear).forEach(l=>{if(y>BOTTOM-4)return;doc.text(`${l.food}  (svårighet ${l.fear}/5, testat ${l.tries} gånger${l.done?', känns okej nu':''})${l.example?' [exempel]':''}`,X,y);y+=5})}
    footer(false);
  }
  function head(d,cont){
    doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text('Självobservation',105,16,{align:'center'});
    doc.setFontSize(10.5);doc.text('Datum och veckodag: ',X,TOP-3);
    doc.setFont('helvetica','normal');const dl=dayLabel(d);doc.text(dl.charAt(0).toUpperCase()+dl.slice(1)+'  ('+d+')'+(cont?'  forts.':''),X+39,TOP-3);
    const dn=drinksOn(d);doc.setFontSize(9.5);doc.text((dn?'Dryck: '+dn+' glas':'')+(S.settings.name?(dn?'   ':'')+'Namn: '+S.settings.name:''),X+W,TOP-3,{align:'right'});
    doc.setLineWidth(.35);doc.setDrawColor(30);doc.rect(X,TOP,W,HEAD);
    let x=X;doc.setFontSize(8.5);COLS.forEach(([t,w])=>{const lines=t.split('\n');lines.forEach((ln,i)=>doc.text(ln,x+w/2,TOP+(HEAD-lines.length*3.4)/2+3+i*3.4,{align:'center'}));x+=w});
    return TOP+HEAD;
  }
  function frame(yEnd){let x=X;doc.setLineWidth(.35);doc.rect(X,TOP,W,yEnd-TOP);COLS.forEach(([,w])=>{doc.line(x,TOP,x,yEnd);x+=w})}
  days.forEach(([d,list])=>{
    newPage();
    let y=head(d,false);doc.setFontSize(9);doc.setFont('helvetica','normal');
    list.forEach(e=>{
      let note=e.note||'';
      if(opts.feel){
        const gd=[e.good.join(', '),e.goodText].filter(Boolean).join('. ');if(gd)note=(note?note+' ':'')+'Gott: '+gd+'.';
        if(e.before!=null||e.after!=null){const f=[e.before!=null?'före '+e.before+'/5':'',e.after!=null?'efter '+e.after+'/5':''].filter(Boolean).join(', ');note=(note?note+' ':'')+'(Oro '+f+')'}}
      const what=(e.label?e.label+': ':'')+e.what+(e.photo?' [foto]':'');
      const cells=[[e.time],doc.splitTextToSize(what,COLS[1][1]-5),doc.splitTextToSize([e.place,e.company].filter(Boolean).join(', '),COLS[2][1]-3),[e.unplanned?'*':''],[(e.beh||[]).join(' ')],doc.splitTextToSize(note,COLS[5][1]-3)];
      const h=Math.max(...cells.map(c=>c.length))*LH+3;
      if(y+h>BOTTOM){frame(BOTTOM);footer();doc.addPage();y=head(d,true);doc.setFontSize(9);doc.setFont('helvetica','normal')}
      let x=X;cells.forEach((c,ci)=>{const off=ci===1?4:1.5;doc.text(c,ci===3?x+COLS[ci][1]/2:x+off,y+4.2,ci===3?{align:'center'}:{});x+=COLS[ci][1]});
      if(e.kind==='maltid'){const bx=X+COLS[0][1]+1.6;doc.setLineWidth(.4);doc.line(bx,y+1.2,bx,y+h-1.2);doc.line(bx,y+1.2,bx+1.3,y+1.2);doc.line(bx,y+h-1.2,bx+1.3,y+h-1.2)}
      doc.setDrawColor(200);doc.setLineWidth(.15);doc.line(X,y+h,X+W,y+h);doc.setDrawColor(30);
      y+=h;
    });
    frame(BOTTOM);footer();
  });
  if(opts.reasons&&Object.values(S.reasons).some(a=>a.length)){
    doc.addPage();drawReasons(doc);footer(false);
  }
  return {days:days.length,blob:doc.output('blob')};
}
function drawReasons(doc){
  const X=15,W=180,BOTTOM=268;
  doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(20);doc.setDrawColor(30);doc.text('Skäl till förändring',X,20);
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.text('Ifylld '+today()+(S.settings.name?'   Namn: '+S.settings.name:''),X+W,20,{align:'right'});
    const gw=W/2,gh=(BOTTOM-28)/2;doc.setLineWidth(.35);doc.roundedRect(X,28,W,BOTTOM-28,4,4);doc.line(X+gw,28,X+gw,BOTTOM);doc.line(X,28+gh,X+W,28+gh);
    QUAD.forEach(([k,t],i)=>{const cx=X+(i%2)*gw,cy=28+Math.floor(i/2)*gh;doc.setFont('helvetica','italic');doc.setFontSize(10);
      doc.text(doc.splitTextToSize(t,gw-8),cx+4,cy+7);doc.line(cx,cy+15,cx+gw,cy+15);
      doc.setFont('helvetica','normal');doc.setFontSize(9.5);let yy=cy+21;
      (S.reasons[k]||[]).forEach(r=>{const ls=doc.splitTextToSize('• '+r,gw-8);if(yy+ls.length*4.2<cy+gh-2){doc.text(ls,cx+4,yy);yy+=ls.length*4.2+1.5}})});
}
window.__elinBuildPdf=buildPdf;
async function downloadReasons(){
  const msg=$('#r-msg');
  if(!Object.values(S.reasons).some(a=>a.length)){msg.textContent='Skriv minst ett skäl först, så finns det något att ladda ner.';return}
  if(!window.jspdf){msg.textContent='PDF-verktyget kunde inte laddas. Kontrollera internetanslutningen och försök igen.';return}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});drawReasons(doc);
  doc.setFontSize(7.5);doc.setTextColor(110);doc.text('Skapad i ELIN (inte vård). Efter arbetsbladet Skäl till förändring, Linder & Nyman Carlsson (2019).',15,281);
  msg.textContent='Förbereder…';
  try{msg.textContent=await saveFile(doc.output('blob'),'skal-till-forandring-'+today()+'.pdf')}
  catch(e){msg.textContent=e&&e.code==='declined'?'Nedladdningen avbröts.':e&&e.code==='rate_limited'?'Vänta en stund och försök igen.':'Det gick inte att spara filen här.'}
}
window.__elinReasons=()=>{const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});drawReasons(doc);return doc.output('blob')};

async function saveFile(blob,name,kind='PDF:en'){
  let dl=null;try{dl=ON_CLAUDE?await window.claude.use('downloads'):null}catch(e){dl=null}
  if(dl){await dl.save({filename:name,data:blob});return `Klart! ${kind} är sparad.`}
  const file=new File([blob],name,{type:blob.type||'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return 'Klart! Välj Spara i Filer eller skicka den direkt.'}catch(e){if(e&&e.name==='AbortError')return 'Nedladdningen avbröts.'}}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  return `Klart! ${kind} är sparad.`;
}
let tt;
function toast(msg,ms=4200){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=msg;clearTimeout(tt);tt=setTimeout(()=>el.remove(),ms)}

let ladderFear=2;
function clearExamples(){S.entries.filter(e=>e.example&&e.photo).forEach(e=>delPhoto(e.id));S.entries=S.entries.filter(e=>!e.example);if(S.reasonsExample){S.reasons=EMPTY_R();S.reasonsExample=false}
  S.ladder=S.ladder.filter(l=>!l.example);for(const k in S.drinks)if(S.drinks[k].example)delete S.drinks[k];
  if(S.goals.example)S.goals=JSON.parse(JSON.stringify(DEFAULT.goals))}
function readPlan(){document.querySelectorAll('[data-pn]').forEach(el=>{const i=+el.dataset.pn,tEl=document.querySelector(`[data-pt="${i}"]`);if(S.plan[i]){S.plan[i].n=el.value.trim()||'Måltid';if(tEl&&tEl.value)S.plan[i].t=tEl.value}});save()}
document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t.matches('[data-scrim]')){closeSheet();return}
  const tab=t.closest('[data-tab]');if(tab){view=tab.dataset.tab;backTo=null;if(view==='dagbok'&&!tab.closest('nav'))day=day;render();toTop();return}
  const go=t.closest('[data-go]');if(go){backTo=PARENT[view]?backTo:view;view=go.dataset.go;render();toTop();return}
  const mo=t.closest('[data-mood]');if(mo){const m=mo.dataset.mood;S.moods[today()]=S.moods[today()]===m?undefined:m;save();render();return}
  const jp=t.closest('[data-jp]');if(jp){const ta=$('#j-text');ta.value=(ta.value?ta.value.replace(/\s*$/,'\n'):'')+jp.dataset.jp;ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);return}
  const jd=t.closest('[data-jdel]');if(jd){if(jd.dataset.sure){S.journal=S.journal.filter(n=>n.id!==jd.dataset.jdel);save();render()}else{jd.dataset.sure='1';jd.textContent='Säker?'}return}
  const ob=t.closest('[data-ob]');if(ob){if(obStep===2)readPlan();obStep=+ob.dataset.ob;render();toTop();return}
  const prm=t.closest('[data-prm]');if(prm){readPlan();S.plan.splice(+prm.dataset.prm,1);save();render();return}
  const sl=t.closest('[data-slot]');if(sl){const s=S.plan[+sl.dataset.slot];const past=day!==today()||toMin(s.t)<toMin(nowHM())-45;entrySheet(null,{label:MEALS.some(m=>m[0]===s.n)?s.n:guessMeal(s.t),time:past?s.t:nowHM()});return}
  const ed=t.closest('[data-edit]');if(ed){entrySheet(S.entries.find(e=>e.id===ed.dataset.edit));return}
  const rd=t.closest('[data-rdel]');if(rd){const[k,i]=rd.dataset.rdel.split(':');S.reasons[k].splice(+i,1);save();render();return}
  const lf=t.closest('#l-fear button');if(lf){ladderFear=+lf.dataset.v;lf.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===lf));return}
  const lt=t.closest('[data-ltry]');if(lt){const l=S.ladder.find(x=>x.id===lt.dataset.ltry);l.tries++;l.example=false;save();render();const r=$('#rung-'+l.id);r&&r.classList.add('pop');
    toast(pick([`Du vågade! ${l.food} är ett steg närmare att kännas vanligt.`,'Modigt gjort. Varje gång blir det lite lättare.','Ett steg upp på stegen. Var stolt över dig själv.']));return}
  const ld=t.closest('[data-ldone]');if(ld){const l=S.ladder.find(x=>x.id===ld.dataset.ldone);l.done=true;save();render();toast('Vad stort! Nu kan du ta nästa steg när du är redo.');return}
  const lx=t.closest('[data-ldel]');if(lx){if(lx.dataset.sure){S.ladder=S.ladder.filter(x=>x.id!==lx.dataset.ldel);save();render()}else{lx.dataset.sure='1';lx.textContent='Ta bort?'}return}
  const a=t.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='new')entrySheet();
  if(act==='saveJournal'){const v=$('#j-text').value.trim();if(!v){toast('Skriv några ord först, eller gå tillbaka.');return}S.journal.push({id:uid(),date:today(),time:nowHM(),text:v});save();day=today();view='dagbok';backTo=null;render();toTop();toast('Sparat. Bara du kan se det.')}
  if(act==='about'){S.settings.noticeHidden=false;save();view='idag';render();toTop()}
  if(act==='obAdd'){readPlan();S.plan.push({n:'Mellanmål',t:'16:00'});save();render()}
  if(act==='obDone'||act==='obSkip'){const keep=$('#o-ex')&&$('#o-ex').checked;const num=id=>{const el=$(id);const v=el?parseFloat(el.value):NaN;return isFinite(v)&&v>0?v:null};
    const st=num('#o-start'),tg=num('#o-target');if(!keep)clearExamples();
    if(act==='obDone'&&st){Object.assign(S.goals,{start:st,target:tg,startDate:today(),pace:0.5,example:false})}
    S.settings.onboarded=true;S.settings.noticeHidden=true;S.plan.sort((a,b)=>a.t.localeCompare(b.t));save();view='idag';render();toTop();toast(keep?'Välkommen. Exemplen kan du ta bort när du vill.':'Välkommen. Allt här är ditt.')}
  if(act==='close')closeSheet();
  if(act==='help')helpSheet();
  if(act==='settings')settingsSheet();
  if(act==='pdf')pdfSheet();
  if(act==='reasonsPdf')downloadReasons();
  if(act==='prev'){day=addDays(day,-1);render()}
  if(act==='next'&&day<today()){day=addDays(day,1);render()}
  if(act==='drink+'||act==='drink-'){const n=Math.max(0,drinksOn(day)+(act==='drink+'?1:-1));S.drinks[day]={n};save();render();if(act==='drink+'&&n===6)toast('Sex glas. Kroppen tackar för vätskan.')}
  if(act==='hideNotice'){S.settings.noticeHidden=true;save();render()}
  if(act==='clearEx'){clearExamples();save();render();toast('Exemplen är borttagna. Nu är det din logg.')}
  if(act==='addWeight'){openSheet(`<header><h2>Veckans vägning</h2><button class="x" data-act="close" aria-label="Stäng">×</button></header>
    <form id="wf" style="display:flex;flex-direction:column;gap:14px"><div class="field"><label for="w-kg">Vikt (kg)</label><input type="number" step="0.1" min="20" max="250" id="w-kg" required></div>
    <p class="small muted">Gärna samma veckodag och tid som du kommit överens om med din behandlare. Siffran sparas till PDF:en och visas inte i appen.</p><button class="primary" type="submit">Spara</button></form>`,()=>{
    $('#wf').addEventListener('submit',e=>{e.preventDefault();const kg=parseFloat($('#w-kg').value);if(!kg)return;S.weights=S.weights.filter(w=>w.d!==today());S.weights.push({d:today(),kg});save();closeSheet();render();toast('Sparat. Tack för att du gör det här.')})})}
  if(act==='ics'){const p2=n=>String(n).padStart(2,'0'),d=new Date(),ds=`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}`;
    const ev=S.plan.map((x,i)=>{const [h,m]=x.t.split(':');return ['BEGIN:VEVENT',`UID:elin-${ds}-${i}@elin`,`DTSTAMP:${ds}T000000Z`,`DTSTART:${ds}T${p2(h)}${p2(m)}00`,'DURATION:PT15M','RRULE:FREQ=DAILY',`SUMMARY:${x.n} 🌱`,'DESCRIPTION:Dags för '+x.n.toLowerCase()+'. Logga i ELIN när du vill.','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+x.n,'TRIGGER:PT0M','END:VALARM','END:VEVENT'].join('\r\n')});
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ELIN//SV','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n');
    saveFile(new Blob([ics],{type:'text/calendar'}),'elin-paminnelser.ics','Kalenderfilen').then(m=>toast(m+' Öppna den och välj Lägg till alla.'));return}
  if(act==='savePlan'){const lines=$('#s-plan').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const p=lines.map(l=>{const m=l.match(/^(.*?)\s*(\d{1,2})[:.](\d{2})$/);return m?{n:m[1]||'Måltid',t:pad(+m[2])+':'+m[3]}:null}).filter(Boolean);
    if(p.length){S.plan=p.sort((a,b)=>a.t.localeCompare(b.t));save();render();toast('Planen är sparad.')}else toast('Skriv ett tillfälle per rad med klockslag, t.ex. Lunch 12:00.')}
  if(act==='wipe'){if(a.dataset.sure){S.entries.forEach(e=>delPhoto(e.id));S=JSON.parse(JSON.stringify(DEFAULT));S.reasons=EMPTY_R();S.reasonsExample=false;S.settings.noticeHidden=true;S.settings.onboarded=true;save();closeSheet();render();toast('Allt är raderat.')}else{a.dataset.sure='1';a.textContent='Tryck igen för att radera allt'}}
});
document.addEventListener('submit',ev=>{
  if(ev.target.id==='ladd'){ev.preventDefault();const v=$('#l-food').value.trim();if(!v)return;S.ladder.push({id:uid(),food:v,fear:ladderFear,tries:0,done:false});save();render();toast('Tillagd på stegen.');return}
  const f=ev.target.closest('[data-radd]');if(!f)return;ev.preventDefault();const k=f.dataset.radd,inp=f.querySelector('input'),v=inp.value.trim();if(!v)return;
  S.reasonsExample=false;S.reasons[k].push(v);save();render();const n=$('#r-'+k);n&&n.focus()});
document.addEventListener('toggle',ev=>{const d=ev.target;if(d.matches&&d.matches('[data-tip]')&&d.open){const i=+d.dataset.tip;if(!S.tipsRead.includes(i)){S.tipsRead.push(i);save()}}},true);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet()});
render();
})();
</script>
